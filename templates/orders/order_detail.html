{% extends 'base.html' %}

{% block content %}

<h2>
Order #{{ order.id }}
</h2>

<p>
Status:
{{ order.status }}
</p>

<p>
Total:
₹{{ order.total_amount }}
</p>

<hr>

{% for item in order.items.all %}

<p>
{{ item.product.name }}
</p>

<p>
Quantity:
{{ item.quantity }}
</p>

<p>
₹{{ item.price }}
</p>

<hr>

{% endfor %}

{% endblock %}
